<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>শুভ জন্মদিন, শ্রাবন্তী</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&family=Baloo+Da+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3ef;--bg2:#e6dcff;--bg3:#d8f3ff;--bg4:#fff0d6;
  --ink:#4a3560;--soft:#7a6590;--card:rgba(255,255,255,.72);--accent:#ff7eb6;--accent2:#8e7cf0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#3a2442;--bg2:#2c2650;--bg3:#1f3550;--bg4:#40323a;--ink:#fbeaff;--soft:#d3bde6;--card:rgba(40,30,60,.72)}
}
:root[data-theme="dark"]{--bg1:#3a2442;--bg2:#2c2650;--bg3:#1f3550;--bg4:#40323a;--ink:#fbeaff;--soft:#d3bde6;--card:rgba(40,30,60,.72)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:'Hind Siliguri',sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2) 38%,var(--bg3) 70%,var(--bg4));background-attachment:fixed;overflow-x:hidden}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;position:relative}
.note{position:absolute;font-size:28px;opacity:.55;animation:float 9s ease-in-out infinite;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(8deg)}}
h1{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;font-weight:800;font-size:clamp(2.4rem,11vw,4.4rem);line-height:1.15;margin:0 0 8px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.age{font-size:1.15rem;color:var(--soft);margin:0 0 28px}
button{font:inherit;font-weight:700;font-size:1.1rem;color:#fff;border:0;border-radius:999px;padding:14px 30px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 8px 22px rgba(142,124,240,.35);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
button:active{transform:scale(.97)}
.card{max-width:460px;margin-top:26px;padding:26px 24px;border-radius:28px;background:var(--card);backdrop-filter:blur(8px);line-height:1.9;font-size:1.08rem;display:none;box-shadow:0 14px 40px rgba(142,124,240,.22)}
.card.show{display:block;animation:pop .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(14px)}to{opacity:1;transform:none}}
.sign{margin-top:14px;font-weight:700;color:var(--accent2)}
.bit{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;pointer-events:none;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.note,.card.show,.bit{animation:none}.bit{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <span class="note" style="top:8%;left:10%">♪</span>
  <span class="note" style="top:18%;right:12%;animation-delay:-3s">♫</span>
  <span class="note" style="bottom:16%;left:14%;animation-delay:-5s">♬</span>
  <span class="note" style="bottom:10%;right:10%;animation-delay:-2s">♪</span>
  <h1>শুভ জন্মদিন,<br>শ্রাবন্তী</h1>
  <p class="age">১৯তম জন্মদিনের শুভেচ্ছা</p>
  <button id="go" type="button">শুভেচ্ছা দেখো</button>
  <div class="card" id="card" aria-live="polite">
    তোমার কণ্ঠে এমন একটা মিষ্টি সুর আছে, যা শুনলে মন ভালো হয়ে যায়।<br>
    নতুন বছরটা তোমার জীবনে নতুন সুর, প্রাণখোলা হাসি আর স্বপ্ন পূরণের আনন্দ নিয়ে আসুক।<br>
    জন্মদিনের অনেক অনেক শুভকামনা রইল।
    <div class="sign">— শাওন</div>
  </div>
</div>
<script>
(function(){
  var btn=document.getElementById('go'),card=document.getElementById('card');
  var colors=['#ff7eb6','#8e7cf0','#6fd3ff','#ffd27a','#8ff0c4'];
  btn.addEventListener('click',function(){
    card.classList.add('show');
    btn.textContent='শুভ জন্মদিন!';
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    for(var i=0;i<60;i++){
      var b=document.createElement('i');b.className='bit';
      b.style.left=Math.random()*100+'vw';
      b.style.background=colors[i%colors.length];
      b.style.animationDuration=(2.5+Math.random()*2.5)+'s';
      b.style.animationDelay=(Math.random()*.8)+'s';
      document.body.appendChild(b);
      setTimeout(function(el){el.remove()},6500,b);
    }
  });
})();
</script>
</body>
</html>
